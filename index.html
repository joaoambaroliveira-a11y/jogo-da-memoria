<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Matemática</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            opacity: 0.85;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .timer-box.urgente {
            background: #ef4444;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .question {
            font-size: 2.3rem;
            font-weight: 700;
            margin: 15px 0 25px;
            letter-spacing: 1px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid transparent;
            color: white;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }

        .option.correct {
            background: #10b981;
            border-color: #059669;
        }

        .option.wrong {
            background: #ef4444;
            border-color: #dc2626;
        }

        .option:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 15px 28px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px 5px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-dificuldade {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            font-size: 1.15rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            color: white;
        }

        .btn-facil { background: #10b981; }
        .btn-facil:hover { background: #059669; transform: translateY(-2px); }
        .btn-medio { background: #f59e0b; }
        .btn-medio:hover { background: #d97706; transform: translateY(-2px); }
        .btn-dificil { background: #ef4444; }
        .btn-dificil:hover { background: #dc2626; transform: translateY(-2px); }

        .feedback {
            font-size: 1.15rem;
            font-weight: 600;
            min-height: 28px;
            margin-bottom: 12px;
        }

        .hidden { display: none !important; }

        .final-score {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 15px 0;
        }

        .result-message {
            font-size: 1.2rem;
            margin-bottom: 25px;
            opacity: 0.95;
        }

        .nivel-atual {
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .descricao-nivel {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 18px; }
            .question { font-size: 1.9rem; }
            .option { font-size: 1.1rem; padding: 14px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1>🧮 Jogo de Matemática</h1>
            <p class="subtitle">Escolha o nível de dificuldade</p>

            <button class="btn-dificuldade btn-facil" onclick="startGame('facil')">
                🟢 Fácil
                <div class="descricao-nivel">15 segundos • Soma e Subtração</div>
            </button>

            <button class="btn-dificuldade btn-medio" onclick="startGame('medio')">
                🟡 Médio
                <div class="descricao-nivel">12 segundos • Todas as operações</div>
            </button>

            <button class="btn-dificuldade btn-dificil" onclick="startGame('dificil')">
                🔴 Difícil
                <div class="descricao-nivel">10 segundos • Multiplicação e Divisão</div>
            </button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="nivel-atual" id="nivel-texto">Nível: Médio</div>

            <div class="score-board">
                <div>Pergunta: <span id="question-number">1</span>/10</div>
                <div>Pontos: <span id="score">0</span></div>
            </div>

            <div class="timer-box" id="timer-box">
                ⏱️ <span id="timer">15</span>s
            </div>

            <div class="question" id="question-text">5 + 3 = ?</div>
            <div class="feedback" id="feedback"></div>
            <div class="options" id="options"></div>
        </div>

        <div id="end-screen" class="hidden">
            <h1>Fim de Jogo!</h1>
            <div class="nivel-atual" id="nivel-final">Nível: Médio</div>
            <div class="final-score" id="final-score">0</div>
            <p class="result-message" id="result-message"></p>
            <button class="btn" onclick="voltarInicio()">Escolher outro nível</button>
            <button class="btn" onclick="jogarNovamente()">Jogar novamente</button>
        </div>
    </div>

    <script>
        let score = 0;
        let currentQuestion = 0;
        let correctAnswer = 0;
        let dificuldade = 'medio';
        let tempoRestante = 15;
        let timerInterval = null;
        const totalQuestions = 10;

        const nomesNivel = {
            facil: '🟢 Fácil',
            medio: '🟡 Médio',
            dificil: '🔴 Difícil'
        };

        const tempoPorNivel = {
            facil: 15,
            medio: 12,
            dificil: 10
        };

        function startGame(nivel) {
            dificuldade = nivel;
            score = 0;
            currentQuestion = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('score').textContent = score;
            document.getElementById('nivel-texto').textContent = 'Nível: ' + nomesNivel[dificuldade];

            nextQuestion();
        }

        function jogarNovamente() {
            startGame(dificuldade);
        }

        function voltarInicio() {
            pararTimer();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function iniciarTimer() {
            pararTimer();
            tempoRestante = tempoPorNivel[dificuldade];
            document.getElementById('timer').textContent = tempoRestante;
            document.getElementById('timer-box').classList.remove('urgente');

            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer').textContent = tempoRestante;

                if (tempoRestante <= 5) {
                    document.getElementById('timer-box').classList.add('urgente');
                }

                if (tempoRestante <= 0) {
                    pararTimer();
                    tempoEsgotado();
                }
            }, 1000);
        }

        function pararTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function tempoEsgotado() {
            const allButtons = document.querySelectorAll('.option');
            allButtons.forEach(btn => btn.disabled = true);

            allButtons.forEach(btn => {
                if (parseInt(btn.textContent) === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            document.getElementById('feedback').textContent = '⏰ Tempo esgotado! A resposta era ' + correctAnswer;
            document.getElementById('feedback').style.color = '#fca5a5';

            setTimeout(nextQuestion, 1300);
        }

        function nextQuestion() {
            pararTimer();

            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            currentQuestion++;
            document.getElementById('question-number').textContent = currentQuestion;
            document.getElementById('feedback').textContent = '';

            const question = generateQuestion();
            document.getElementById('question-text').textContent = question.text;
            correctAnswer = question.answer;

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + Math.floor(Math.random() * 17) - 8;
                if (wrong !== correctAnswer && wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options = options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });

            iniciarTimer();
        }

        function generateQuestion() {
            let a, b, answer, text, op;

            if (dificuldade === 'facil') {
                op = Math.random() < 0.6 ? '+' : '-';
                if (op === '+') {
                    a = Math.floor(Math.random() * 15) + 1;
                    b = Math.floor(Math.random() * 15) + 1;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else {
                    a = Math.floor(Math.random() * 20) + 10;
                    b = Math.floor(Math.random() * (a - 1)) + 1;
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                }
            }
            else if (dificuldade === 'medio') {
                const ops = ['+', '-', '×', '÷'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '+') {
                    a = Math.floor(Math.random() * 40) + 10;
                    b = Math.floor(Math.random() * 40) + 10;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else if (op === '-') {
                    a = Math.floor(Math.random() * 50) + 30;
                    b = Math.floor(Math.random() * a);
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                } else if (op === '×') {
                    a = Math.floor(Math.random() * 10) + 2;
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = a * b;
                    text = a + ' × ' + b + ' = ?';
                } else {
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = Math.floor(Math.random() * 10) + 2;
                    a = b * answer;
                    text = a + ' ÷ ' + b + ' = ?';
                }
            }
            else {
                const ops = ['+', '-', '×', '×', '÷', '÷'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '+') {
                    a = Math.floor(Math.random() * 80) + 40;
                    b = Math.floor(Math.random() * 80) + 40;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else if (op === '-') {
                    a = Math.floor(Math.random() * 100) + 50;
                    b = Math.floor(Math.random() * (a - 10)) + 10;
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                } else if (op === '×') {
                    a = Math.floor(Math.random() * 14) + 6;
                    b = Math.floor(Math.random() * 12) + 4;
                    answer = a * b;
                    text = a + ' × ' + b + ' = ?';
                } else {
                    b = Math.floor(Math.random() * 11) + 4;
                    answer = Math.floor(Math.random() * 14) + 4;
                    a = b * answer;
                    text = a + ' ÷ ' + b + ' = ?';
                }
            }
            return { text, answer };
        }

        function checkAnswer(button, selected) {
            pararTimer();

            const allButtons = document.querySelectorAll('.option');
            allButtons.forEach(btn => btn.disabled = true);

            if (selected === correctAnswer) {
                button.classList.add('correct');
                score++;
                document.getElementById('score').textContent = score;
                document.getElementById('feedback').textContent = '✅ Correto!';
                document.getElementById('feedback').style.color = '#86efac';
            } else {
                button.classList.add('wrong');
                document.getElementById('feedback').textContent = '❌ Errado! A resposta era ' + correctAnswer;
                document.getElementById('feedback').style.color = '#fca5a5';

                allButtons.forEach(btn => {
                    if (parseInt(btn.textContent) === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            setTimeout(nextQuestion, 1100);
        }

        function endGame() {
            pararTimer();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');

            document.getElementById('final-score').textContent = score;
            document.getElementById('nivel-final').textContent = 'Nível: ' + nomesNivel[dificuldade];

            let message = '';
            if (score === 10) message = '🏆 Perfeito! Você mandou muito bem!';
            else if (score >= 8) message = '🎉 Excelente resultado!';
            else if (score >= 6) message = '👍 Bom trabalho! Continue praticando.';
            else if (score >= 4) message = '😊 Mais ou menos... Tente de novo!';
            else message = '💪 Não desanime! Pratique mais que você melhora.';

            document.getElementById('result-message').textContent = message;
        }
    </script>
</body>
</html>
