<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Matemática - Disputa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            opacity: 0.85;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 12px 20px;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .question {
            font-size: 2.3rem;
            font-weight: 700;
            margin: 15px 0 25px;
            letter-spacing: 1px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid transparent;
            color: white;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }

        .option.correct {
            background: #10b981;
            border-color: #059669;
        }

        .option.wrong {
            background: #ef4444;
            border-color: #dc2626;
        }

        .option:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin: 6px 4px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-secundario {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .btn-dificuldade {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            font-size: 1.15rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            color: white;
        }

        .btn-facil { background: #10b981; }
        .btn-facil:hover { background: #059669; transform: translateY(-2px); }
        .btn-medio { background: #f59e0b; }
        .btn-medio:hover { background: #d97706; transform: translateY(-2px); }
        .btn-dificil { background: #ef4444; }
        .btn-dificil:hover { background: #dc2626; transform: translateY(-2px); }

        .feedback {
            font-size: 1.15rem;
            font-weight: 600;
            min-height: 28px;
            margin-bottom: 12px;
        }

        .hidden { display: none !important; }

        .final-score {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 10px 0 0;
        }

        .tempo-final {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 12px 0;
            background: rgba(0,0,0,0.25);
            display: inline-block;
            padding: 10px 22px;
            border-radius: 14px;
        }

        .result-message {
            font-size: 1.15rem;
            margin: 15px 0 20px;
            opacity: 0.95;
        }

        .nivel-atual {
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .descricao-nivel {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .input-nome {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            margin: 12px 0 18px;
            outline: none;
        }

        .input-nome::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .input-nome:focus {
            border-color: #60a5fa;
        }

        .jogador-atual {
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .ranking-lista {
            text-align: left;
            max-height: 320px;
            overflow-y: auto;
            margin: 15px 0 20px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            gap: 10px;
        }

        .ranking-item.top1 {
            background: linear-gradient(90deg, rgba(251,191,36,0.35), rgba(0,0,0,0.25));
            border: 1px solid rgba(251,191,36,0.5);
        }

        .ranking-item.top2 {
            background: linear-gradient(90deg, rgba(156,163,175,0.3), rgba(0,0,0,0.25));
        }

        .ranking-item.top3 {
            background: linear-gradient(90deg, rgba(180,83,9,0.3), rgba(0,0,0,0.25));
        }

        .ranking-pos {
            font-size: 1.2rem;
            font-weight: 800;
            width: 32px;
            text-align: center;
        }

        .ranking-info {
            flex: 1;
        }

        .ranking-nome {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .ranking-detalhes {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        .ranking-vazio {
            opacity: 0.7;
            padding: 30px 10px;
            font-size: 1.05rem;
        }

        .filtros-ranking {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            background: rgba(255,255,255,0.15);
            border: 2px solid transparent;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .filtro-btn.ativo {
            background: white;
            color: #1e3a8a;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 18px; }
            .question { font-size: 1.9rem; }
            .option { font-size: 1.1rem; padding: 14px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Tela Nome -->
        <div id="nome-screen">
            <h1>🧮 Disputa de Matemática</h1>
            <p class="subtitle">Digite seu nome para entrar na disputa!</p>

            <input type="text" class="input-nome" id="input-nome-inicio" placeholder="Seu nome" maxlength="15">

            <button class="btn" style="width:100%;" onclick="irParaNiveis()">Continuar</button>

            <button class="btn btn-secundario" style="margin-top:15px; width:100%;" onclick="mostrarRanking()">
                🏆 Ver Ranking
            </button>
        </div>

        <!-- Tela Níveis -->
        <div id="start-screen" class="hidden">
            <h1>🧮 Escolha o Nível</h1>
            <div class="jogador-atual" id="jogador-nome">Jogador: —</div>
            <p class="subtitle">Quem termina mais rápido vence!</p>

            <button class="btn-dificuldade btn-facil" onclick="startGame('facil')">
                🟢 Fácil
                <div class="descricao-nivel">Números pequenos • Soma e Subtração</div>
            </button>

            <button class="btn-dificuldade btn-medio" onclick="startGame('medio')">
                🟡 Médio
                <div class="descricao-nivel">Números médios • Todas as operações</div>
            </button>

            <button class="btn-dificuldade btn-dificil" onclick="startGame('dificil')">
                🔴 Difícil
                <div class="descricao-nivel">Números grandes • Multiplicação e Divisão</div>
            </button>

            <button class="btn btn-secundario" style="margin-top:15px; width:100%;" onclick="voltarParaNome()">
                Trocar nome
            </button>
        </div>

        <!-- Tela do Jogo -->
        <div id="game-screen" class="hidden">
            <div class="jogador-atual" id="jogador-jogo">Jogador: —</div>
            <div class="nivel-atual" id="nivel-texto">Nível: Médio</div>

            <div class="score-board">
                <div>Pergunta: <span id="question-number">1</span>/10</div>
                <div>Pontos: <span id="score">0</span></div>
            </div>

            <div class="timer-box">
                ⏱️ <span id="timer">00:00</span>
            </div>

            <div class="question" id="question-text">5 + 3 = ?</div>
            <div class="feedback" id="feedback"></div>
            <div class="options" id="options"></div>
        </div>

        <!-- Tela Final -->
        <div id="end-screen" class="hidden">
            <h1>Fim de Jogo!</h1>
            <div class="jogador-atual" id="jogador-final">Jogador: —</div>
            <div class="nivel-atual" id="nivel-final">Nível: Médio</div>
            
            <div class="final-score" id="final-score">0</div>
            <p style="opacity:0.8; margin-bottom:5px;">pontos</p>

            <div class="tempo-final">
                ⏱️ Tempo: <span id="tempo-final">00:00</span>
            </div>

            <p class="result-message" id="result-message"></p>

            <div>
                <button class="btn" onclick="salvarRanking()">💾 Salvar no Ranking</button>
            </div>
            <div style="margin-top:10px;">
                <button class="btn btn-secundario" onclick="mostrarRanking()">🏆 Ver Ranking</button>
                <button class="btn btn-secundario" onclick="jogarNovamente()">Jogar novamente</button>
            </div>
            <div style="margin-top:8px;">
                <button class="btn btn-secundario" onclick="voltarInicio()">Escolher outro nível</button>
            </div>
        </div>

        <!-- Tela Ranking -->
        <div id="ranking-screen" class="hidden">
            <h1>🏆 Ranking</h1>
            <p class="subtitle">Quem fez em menos tempo</p>

            <div class="filtros-ranking">
                <button class="filtro-btn ativo" id="filtro-todos" onclick="filtrarRanking('todos')">Todos</button>
                <button class="filtro-btn" id="filtro-facil" onclick="filtrarRanking('facil')">Fácil</button>
                <button class="filtro-btn" id="filtro-medio" onclick="filtrarRanking('medio')">Médio</button>
                <button class="filtro-btn" id="filtro-dificil" onclick="filtrarRanking('dificil')">Difícil</button>
            </div>

            <div class="ranking-lista" id="ranking-lista"></div>

            <button class="btn" onclick="voltarParaNome()">Voltar</button>
            <button class="btn btn-secundario" onclick="limparRanking()">Limpar ranking</button>
        </div>
    </div>

    <script>
        let score = 0;
        let currentQuestion = 0;
        let correctAnswer = 0;
        let dificuldade = 'medio';
        let segundos = 0;
        let timerInterval = null;
        let filtroAtual = 'todos';
        let nomeJogador = '';
        const totalQuestions = 10;

        const nomesNivel = {
            facil: '🟢 Fácil',
            medio: '🟡 Médio',
            dificil: '🔴 Difícil'
        };

        function formatarTempo(seg) {
            const min = Math.floor(seg / 60);
            const s = seg % 60;
            return (min < 10 ? '0' + min : min) + ':' + (s < 10 ? '0' + s : s);
        }

        function irParaNiveis() {
            const nome = document.getElementById('input-nome-inicio').value.trim();
            if (!nome) {
                alert('Digite seu nome para entrar na disputa!');
                document.getElementById('input-nome-inicio').focus();
                return;
            }
            nomeJogador = nome;
            document.getElementById('jogador-nome').textContent = 'Jogador: ' + nomeJogador;
            document.getElementById('nome-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function voltarParaNome() {
            pararTimer();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('ranking-screen').classList.add('hidden');
            document.getElementById('nome-screen').classList.remove('hidden');
        }

        function startGame(nivel) {
            dificuldade = nivel;
            score = 0;
            currentQuestion = 0;
            segundos = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('ranking-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('score').textContent = score;
            document.getElementById('nivel-texto').textContent = 'Nível: ' + nomesNivel[dificuldade];
            document.getElementById('jogador-jogo').textContent = 'Jogador: ' + nomeJogador;
            document.getElementById('timer').textContent = '00:00';

            pararTimer();
            timerInterval = setInterval(() => {
                segundos++;
                document.getElementById('timer').textContent = formatarTempo(segundos);
            }, 1000);

            nextQuestion();
        }

        function jogarNovamente() {
            startGame(dificuldade);
        }

        function voltarInicio() {
            pararTimer();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('ranking-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('jogador-nome').textContent = 'Jogador: ' + nomeJogador;
        }

        function pararTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            currentQuestion++;
            document.getElementById('question-number').textContent = currentQuestion;
            document.getElementById('feedback').textContent = '';

            const question = generateQuestion();
            document.getElementById('question-text').textContent = question.text;
            correctAnswer = question.answer;

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + Math.floor(Math.random() * 17) - 8;
                if (wrong !== correctAnswer && wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options = options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });
        }

        function generateQuestion() {
            let a, b, answer, text, op;

            if (dificuldade === 'facil') {
                op = Math.random() < 0.6 ? '+' : '-';
                if (op === '+') {
                    a = Math.floor(Math.random() * 15) + 1;
                    b = Math.floor(Math.random() * 15) + 1;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else {
                    a = Math.floor(Math.random() * 20) + 10;
                    b = Math.floor(Math.random() * (a - 1)) + 1;
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                }
            }
            else if (dificuldade === 'medio') {
                const ops = ['+', '-', '×', '÷'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '+') {
                    a = Math.floor(Math.random() * 40) + 10;
                    b = Math.floor(Math.random() * 40) + 10;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else if (op === '-') {
                    a = Math.floor(Math.random() * 50) + 30;
                    b = Math.floor(Math.random() * a);
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                } else if (op === '×') {
                    a = Math.floor(Math.random() * 10) + 2;
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = a * b;
                    text = a + ' × ' + b + ' = ?';
                } else {
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = Math.floor(Math.random() * 10) + 2;
                    a = b * answer;
                    text = a + ' ÷ ' + b + ' = ?';
                }
            }
            else {
                const ops = ['+', '-', '×', '×', '÷', '÷'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '+') {
                    a = Math.floor(Math.random() * 80) + 40;
                    b = Math.floor(Math.random() * 80) + 40;
                    answer = a + b;
                    text = a + ' + ' + b + ' = ?';
                } else if (op === '-') {
                    a = Math.floor(Math.random() * 100) + 50;
                    b = Math.floor(Math.random() * (a - 10)) + 10;
                    answer = a - b;
                    text = a + ' - ' + b + ' = ?';
                } else if (op === '×') {
                    a = Math.floor(Math.random() * 14) + 6;
                    b = Math.floor(Math.random() * 12) + 4;
                    answer = a * b;
                    text = a + ' × ' + b + ' = ?';
                } else {
                    b = Math.floor(Math.random() * 11) + 4;
                    answer = Math.floor(Math.random() * 14) + 4;
                    a = b * answer;
                    text = a + ' ÷ ' + b + ' = ?';
                }
            }
            return { text, answer };
        }

        function checkAnswer(button, selected) {
            const allButtons = document.querySelectorAll('.option');
            allButtons.forEach(btn => btn.disabled = true);

            if (selected === correctAnswer) {
                button.classList.add('correct');
                score++;
                document.getElementById('score').textContent = score;
                document.getElementById('feedback').textContent = '✅ Correto!';
                document.getElementById('feedback').style.color = '#86efac';
            } else {
                button.classList.add('wrong');
                document.getElementById('feedback').textContent = '❌ Errado! A resposta era ' + correctAnswer;
                document.getElementById('feedback').style.color = '#fca5a5';

                allButtons.forEach(btn => {
                    if (parseInt(btn.textContent) === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            setTimeout(nextQuestion, 900);
        }

        function endGame() {
            pararTimer();

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');

            document.getElementById('final-score').textContent = score;
            document.getElementById('nivel-final').textContent = 'Nível: ' + nomesNivel[dificuldade];
            document.getElementById('jogador-final').textContent = 'Jogador: ' + nomeJogador;
            document.getElementById('tempo-final').textContent = formatarTempo(segundos);

            let message = '';
            if (score === 10) message = '🏆 Perfeito! Você mandou muito bem!';
            else if (score >= 8) message = '🎉 Excelente resultado!';
            else if (score >= 6) message = '👍 Bom trabalho! Continue praticando.';
            else if (score >= 4) message = '😊 Mais ou menos... Tente de novo!';
            else message = '💪 Não desanime! Pratique mais que você melhora.';

            if (segundos < 45) message += ' Tempo incrível!';
            else if (segundos < 70) message += ' Bom tempo!';

            document.getElementById('result-message').textContent = message;
        }

        // ========== RANKING ==========
        function getRanking() {
            const dados = localStorage.getItem('rankingMatematica');
            return dados ? JSON.parse(dados) : [];
        }

        function salvarRanking() {
            if (!nomeJogador) {
                alert('Nome não encontrado. Volte e digite seu nome.');
                return;
            }

            const ranking = getRanking();

            ranking.push({
                nome: nomeJogador,
                score: score,
                tempo: segundos,
                dificuldade: dificuldade,
                data: new Date().toLocaleDateString('pt-BR')
            });

            ranking.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.tempo - b.tempo;
            });

            if (ranking.length > 50) ranking.length = 50;

            localStorage.setItem('rankingMatematica', JSON.stringify(ranking));

            alert('Resultado de ' + nomeJogador + ' salvo no ranking! 🏆');
            mostrarRanking();
        }

        function filtrarRanking(filtro) {
            filtroAtual = filtro;
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('ativo'));
            document.getElementById('filtro-' + filtro).classList.add('ativo');
            renderizarRanking();
        }

        function mostrarRanking() {
            pararTimer();
            document.getElementById('nome-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('ranking-screen').classList.remove('hidden');

            filtroAtual = 'todos';
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('ativo'));
            document.getElementById('filtro-todos').classList.add('ativo');

            renderizarRanking();
        }

        function renderizarRanking() {
            let ranking = getRanking();

            if (filtroAtual !== 'todos') {
                ranking = ranking.filter(r => r.dificuldade === filtroAtual);
            }

            ranking.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.tempo - b.tempo;
            });

            const lista = document.getElementById('ranking-lista');

            if (ranking.length === 0) {
                lista.innerHTML = '<div class="ranking-vazio">Nenhum resultado ainda.<br>Seja o primeiro da disputa!</div>';
                return;
            }

            const top = ranking.slice(0, 15);
            let html = '';

            top.forEach((item, index) => {
                const pos = index + 1;
                let classe = '';
                let medalha = pos + 'º';

                if (pos === 1) { classe = 'top1'; medalha = '🥇'; }
                else if (pos === 2) { classe = 'top2'; medalha = '🥈'; }
                else if (pos === 3) { classe = 'top3'; medalha = '🥉'; }

                html += `
                    <div class="ranking-item ${classe}">
                        <div class="ranking-pos">${medalha}</div>
                        <div class="ranking-info">
                            <div class="ranking-nome">${item.nome}</div>
                            <div class="ranking-detalhes">
                                ${item.score}/10 pts • ⏱️ ${formatarTempo(item.tempo)} • ${nomesNivel[item.dificuldade]}
                            </div>
                        </div>
                    </div>
                `;
            });

            lista.innerHTML = html;
        }

        function limparRanking() {
            if (confirm('Tem certeza que deseja apagar todo o ranking?')) {
                localStorage.removeItem('rankingMatematica');
                renderizarRanking();
            }
        }
    </script>
</body>
</html>
